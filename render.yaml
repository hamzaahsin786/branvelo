# Render blueprint for the Mezban API (apps/api — Fastify)
# Deploy via Render Dashboard → New → Blueprint → connect the mezban repo.
# Then set the env vars below in the Render dashboard (all secrets stay there, never in git).

services:
  - type: web
    name: mezban-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false # set in dashboard — Supabase project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # set in dashboard — Supabase service_role key (NEVER the anon key)
      - key: WEB_ORIGIN
        sync: false # set in dashboard — e.g. https://mezban-web.vercel.app (no trailing slash)
